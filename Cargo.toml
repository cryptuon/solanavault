[workspace]
resolver = "2"
members = [
    "crates/vault-core",
    "crates/vault-node",
    "crates/vault-cli",
    "crates/vault-rpc-proxy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/solana-vault"
keywords = ["solana", "blockchain", "storage", "decentralized"]
categories = ["cryptography::cryptocurrencies"]

[workspace.dependencies]
solana-sdk = "1.18"
solana-client = "1.18"
solana-rpc-client = "1.18"
solana-transaction-status = "1.18"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
reqwest = { version = "0.11", features = ["json"] }
flate2 = "1.0"
lz4 = "1.25"
bincode = "1.3"
clap = { version = "4.0", features = ["derive"] }
nng = "1.0"
uuid = { version = "1.0", features = ["v4"] }
sha2 = "0.10"
futures = "0.3"
async-trait = "0.1"
env_logger = "0.10"
log = "0.4"
rand = "0.8"
tempfile = "3.0"
tokio-test = "0.4"