[workspace]
members = [
    "crates/vault-core",
    "crates/vault-node",
    "crates/vault-cli",
    "crates/vault-rpc-proxy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/solana-vault"
keywords = ["solana", "blockchain", "storage", "decentralized"]
categories = ["cryptography::cryptocurrencies"]

[workspace.dependencies]
solana-sdk = "1.16"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"