site_name: SolanaVault Documentation
site_description: Decentralized blockchain compression and storage network for Solana
site_author: Cryptuon Research
site_url: https://docs.cryptuon.com/solanavault/

repo_name: cryptuon/solanavault
repo_url: https://github.com/cryptuon/solanavault
edit_uri: edit/main/documentation/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.mark
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Docs:
    - Getting Started:
      - Quick Start: guides/quickstart.md
      - Installation: guides/installation.md
    - User Guides:
      - Light Client: guides/light-client.md
      - Gateway Operators: guides/gateway-operators.md
      - Full Node Setup: guides/full-node.md
      - Node Dashboard: guides/node-dashboard.md
    - Architecture:
      - Overview: architecture/overview.md
      - Smart Contracts: architecture/smart-contracts.md
      - Tokenomics: architecture/tokenomics.md
      - Compression Pipeline: architecture/compression.md
      - Network Protocol: architecture/network.md
      - Economics: architecture/economics.md
    - Troubleshooting:
      - Common Issues: troubleshooting/common-issues.md
      - FAQ: troubleshooting/faq.md
  - API Reference:
    - API: reference/api.md
    - Configuration: reference/configuration.md
    - CLI Commands: reference/cli.md

extra:
  homepage: https://solanavault.cryptuon.com/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cryptuon/solanavault
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/solanavault

copyright: &copy; 2026 Cryptuon Research
