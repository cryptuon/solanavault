[workspace]
members = [
    "vault-token",
    "vault-staking",
    "vault-rewards",
    "vault-governance",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/solanavault/solanavault"

[workspace.dependencies]
anchor-lang = "0.29.0"
anchor-spl = "0.29.0"
solana-program = "1.18"
spl-token = "4.0"
spl-associated-token-account = "2.3"
